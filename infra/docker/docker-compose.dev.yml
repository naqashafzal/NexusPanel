version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: hostsphere_dev_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hostsphere
    ports:
      - '5432:5432'
    volumes:
      - hostsphere_dev_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hostsphere_dev_redis
    ports:
      - '6379:6379'
    volumes:
      - hostsphere_dev_redis_data:/data
    restart: unless-stopped

volumes:
  hostsphere_dev_postgres_data:
  hostsphere_dev_redis_data:
